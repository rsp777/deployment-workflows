name: Build and Deploy Artifact to Maven Registry
on:
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove existing settings.xml
        run: rm -f $HOME/.m2/settings.xml
      - name: Setup Maven settings
        uses: s4u/maven-settings-action@v4.0.0
        with:
          override: true
          servers: |
            [{"id":"github","username":"${{ secrets.USERNAME }}","password":"${{ secrets.PASSWORD }}"}]
          repositories: |
            [{"id":"github","name":"${{ secrets.REPO_NAME }}","url":"${{ secrets.REPO_URL }}","snapshots":{"enabled":true}}]

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Maven Build
        run: mvn clean package -s $HOME/.m2/settings.xml -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/*.jar
          if-no-files-found: error
          retention-days: 90

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Maven settings
        uses: s4u/maven-settings-action@v4.0.0
        with:
          override: true
          servers: |
            [{"id":"github","username":"${{ secrets.USERNAME }}","password":"${{ secrets.PASSWORD }}"}]
          repositories: |
            [{"id":"github","name":"${{ secrets.REPO_NAME }}","url":"${{ secrets.REPO_URL }}","snapshots":{"enabled":true}}]

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          
      - name: Run tests
        run: mvn test

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Maven settings
        uses: s4u/maven-settings-action@v4.0.0
        with:
          override: true
          servers: |
            [{"id":"github","username":"${{ secrets.USERNAME }}","password":"${{ secrets.PASSWORD }}"}]
          repositories: |
            [{"id":"github","name":"${{ secrets.REPO_NAME }}","url":"${{ secrets.REPO_URL }}","snapshots":{"enabled":true}}]

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          
      - name: Create and push tag (increment if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -e
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config user.name "$GIT_AUTHOR_NAME"

          # 1. Read the current version from the Maven project
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            TAG="v${{ github.run_number }}"
          else
            # 2. Check if the tag already exists in the remote repository
            if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
              echo "Tag ${VERSION} already exists. Incrementing version..."
              
              # 3. Increment the patch version (e.g., 1.0.0 -> 1.0.1)
              NEW_VERSION=$(echo "$VERSION" | awk -F. -v OFS=. '{$NF += 1 ; print}')
              
              echo "Updating pom.xml to $NEW_VERSION"
              # Update the pom.xml using Maven
              mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
              
              # 4. Commit and push the updated pom.xml back to the repository
              git add pom.xml
              # [skip ci] is critical here to prevent this push from triggering an infinite pipeline loop
              git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
              git push origin HEAD:${GITHUB_REF#refs/heads/}
              
              TAG="$NEW_VERSION"
            else
              echo "Tag ${VERSION} is available."
              TAG="$VERSION"
            fi
          fi

          echo "Creating tag $TAG for SHA $GITHUB_SHA"

          # Push the tag (GITHUB_TOKEN provided via persist-credentials)
          git push origin "$TAG"
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          # Artifact name
          name: build-artifact
          # Destination path
          path: ./downloaded-artifacts

      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
