name: Build and Deploy Artifact to Maven Registry

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      
    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java and enable Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # 3. Clean environment before generating Maven settings
      - name: Remove existing settings.xml
        run: rm -f $HOME/.m2/settings.xml

      # 4. Configure Maven settings
      - name: Setup Maven settings
        uses: s4u/maven-settings-action@v3.0.0
        with:
          override: true
          servers: |
            [{"id":"github","username":"${{ secrets.USERNAME }}","password":"${{ secrets.PASSWORD }}"}]
          repositories: |
            [{"id":"github","name":"${{ secrets.REPO_NAME }}","url":"${{ secrets.REPO_URL }}","snapshots":{"enabled":true}}]

      # 5. Check for existing tag, bump pom.xml if needed, and create tag
      - name: Version bump and push tag
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -e
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config user.name "$GIT_AUTHOR_NAME"

          # Read the current version from the Maven project
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            TAG="v${{ github.run_number }}"
          else
            # Check if the tag already exists in the remote repository
            if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
              echo "Tag ${VERSION} already exists. Incrementing version..."
              
              # Increment the patch version (e.g., 1.0.0 -> 1.0.1)
              NEW_VERSION=$(echo "$VERSION" | awk -F. -v OFS=. '{$NF += 1 ; print}')
              
              echo "Updating pom.xml to $NEW_VERSION"
              # Update the pom.xml using Maven
              mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
              
              # Commit and push the updated pom.xml back to the repository
              git add pom.xml
              git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
              git push origin HEAD:${GITHUB_REF#refs/heads/}
              
              TAG="$NEW_VERSION"
            else
              echo "Tag ${VERSION} is available."
              TAG="$VERSION"
            fi
          fi

          echo "Creating tag $TAG for SHA $GITHUB_SHA"

          # Create and push the annotated tag
          git tag -a "$TAG" -m "Release $TAG ($GITHUB_SHA)"
          git push origin "$TAG"

      # 6. Build, Test, and Deploy using the (potentially updated) pom.xml
      - name: Publish to GitHub Packages
        run: mvn clean deploy -s $HOME/.m2/settings.xml
